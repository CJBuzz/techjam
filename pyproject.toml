[project]
name = "robust-aigc-detector"
version = "0.1.0"
description = "Frozen CLIP + forensic EfficientNet detector for robust AI-generated image detection"
requires-python = ">=3.10,<3.13"
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.45",
  "tqdm>=4.66",
]

[project.scripts]
aigc-train = "aigc_detector.train:main"
aigc-train-mixture = "aigc_detector.train_mixture:main"
aigc-predict = "aigc_detector.predict:main"
aigc-evaluate = "aigc_detector.evaluate:main"
aigc-severity = "aigc_detector.severity:main"
aigc-calibrate = "aigc_detector.calibrate:main"
aigc-shortcut-audit = "aigc_detector.shortcut_audit:main"

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["aigc_detector"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
